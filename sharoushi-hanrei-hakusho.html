<title>白書・判例ドリル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* レイアウト：スマホ1カラム。上に章見出し、下に固定タブ。判決文・白書本文は明朝で「原文らしく」、操作系はゴシック。 */
:root{
  --bg:#F3F4F7; --paper:#FFFFFF; --ink:#1A2132; --sub:#5A6378; --line:#DADDE6;
  --accent:#2B3F8F; --accent-soft:#E6EAF6; --seal:#B5332B; --seal-soft:#F8E6E4;
  --ok:#2C7A57; --ok-soft:#E2F2EA; --warn:#9A6A00; --warn-soft:#FBF1D9;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --f-text:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --tab-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141B; --paper:#1A1F2A; --ink:#E7E9F0; --sub:#9AA2B5; --line:#2D3445;
  --accent:#93A6F2; --accent-soft:#232C47; --seal:#E8746A; --seal-soft:#3A2424;
  --ok:#62C595; --ok-soft:#1C3329; --warn:#E3B54F; --warn-soft:#3A3020; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141B; --paper:#1A1F2A; --ink:#E7E9F0; --sub:#9AA2B5; --line:#2D3445;
  --accent:#93A6F2; --accent-soft:#232C47; --seal:#E8746A; --seal-soft:#3A2424;
  --ok:#62C595; --ok-soft:#1C3329; --warn:#E3B54F; --warn-soft:#3A3020; color-scheme:dark}
*{box-sizing:border-box}
/* 連続タップで画面が拡大されないようにする（2本指での拡大は残す） */
html,body,button,a,input,select,textarea,summary{touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.35}
h1{font-size:21px;font-weight:700}
h2{font-size:17px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:11.5px;letter-spacing:.08em;color:var(--sub);font-weight:700}
.muted{color:var(--sub);font-size:13px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn.block{width:100%;padding:13px}
.btn.ghost{background:transparent}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.seal{background:var(--seal-soft);color:var(--seal)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}

/* 上部 */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.top .yr{font-family:var(--f-text);font-size:12.5px;color:var(--sub)}

/* カウントダウン */
.count{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.count .num{font-family:var(--f-text);font-size:44px;font-weight:700;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.count .num small{font-size:16px;margin-left:2px}
.meter{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.meter div{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.meter b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.meter span{font-size:11.5px;color:var(--sub)}

/* 戦略 */
details.guide{background:var(--paper);border:1px solid var(--line);border-radius:12px}
details.guide summary{list-style:none;padding:14px 16px;font-weight:700;display:flex;justify-content:space-between;gap:10px}
details.guide summary::-webkit-details-marker{display:none}
details.guide summary::after{content:"＋";color:var(--sub)}
details.guide[open] summary::after{content:"－"}
details.guide .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.guide ol,.guide ul{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.timeline{display:flex;flex-direction:column;gap:0}
.timeline .t{display:grid;grid-template-columns:86px 1fr;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.timeline .t:first-child{border-top:0}
.timeline .when{font-weight:700;font-size:13px;color:var(--accent)}
.timeline .now .when::after{content:"いまここ";display:block;font-size:10.5px;color:var(--seal)}

/* 一覧 */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 10px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;width:100%}
.item .t{font-weight:700;min-width:0}
.item .m{grid-column:1/-1;font-size:12.5px;color:var(--sub)}
.box{font-size:11px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--ok)}

/* 本文（判決文・白書文） */
.passage{font-family:var(--f-text);font-size:16.5px;line-height:2.05;letter-spacing:.01em}
.passage .lbl{font-family:var(--f-body);font-size:12px;color:var(--sub);display:block;margin-bottom:4px}
.blank{display:inline;border:0;border-bottom:2px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-family:var(--f-body);font-weight:700;font-size:14.5px;padding:1px 8px;margin:0 2px;border-radius:4px 4px 0 0;line-height:1.6}
.blank.active{background:var(--accent);color:var(--paper)}
.blank.right{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.blank.wrong{background:var(--seal-soft);color:var(--seal);border-color:var(--seal)}
.blank .fix{display:block;font-size:11.5px;font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:11px 10px;font-weight:500;font-size:14px;text-align:left;line-height:1.45;min-width:0;overflow-wrap:anywhere}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:700}
.opt.wrong{border-color:var(--seal);background:var(--seal-soft);color:var(--seal)}
.opt:disabled{cursor:default}
.gogun{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.gogun .opt{padding:8px 8px;font-size:13.5px}
.gogun .opt b{color:var(--sub);margin-right:4px;font-variant-numeric:tabular-nums}
.gogun .opt.used{opacity:.45}
.point{border-left:3px solid var(--accent);padding:4px 0 4px 12px;font-size:14px}
.result{display:flex;align-items:baseline;gap:10px}
.result .score{font-family:var(--f-text);font-size:40px;font-weight:700;font-variant-numeric:tabular-nums}
.stamp{display:inline-block;border:2px solid var(--seal);color:var(--seal);border-radius:6px;padding:0 8px;font-weight:700;transform:rotate(-4deg);font-size:14px}
.stamp.ok{border-color:var(--ok);color:var(--ok)}
.dir{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dir .opt{text-align:center;font-weight:700;font-size:15px}
.seg{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 4px;font-size:13px;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--accent);color:var(--paper)}

.note{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13px}

/* 過去問分析 */
.bar{display:flex;gap:2px;border-radius:8px;overflow:hidden;font-size:12px;font-weight:700}
.bar span{padding:6px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;text-align:center}
.b-seal{background:var(--seal-soft);color:var(--seal)}.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-acc{background:var(--accent-soft);color:var(--accent)}
.ul{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px;font-size:14px}
.kq{display:flex;flex-direction:column;gap:6px}
.kr{display:grid;grid-template-columns:18px auto 1fr;gap:8px;align-items:start;font-size:13.5px}
.kr .chip{margin-top:2px}.kt{min-width:0;overflow-wrap:anywhere}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--sub)}
.opt b{color:var(--sub);margin-right:2px}

/* 選択肢を画面下に固定する */
.dock{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));z-index:15;background:var(--bg);border-top:1px solid var(--line);box-shadow:0 -6px 16px rgba(0,0,0,.06);max-height:48vh;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px}
.dock-in{max-width:528px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.dock-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--sub)}
.dock-h .btn{padding:7px 12px}
/* 過去問一覧 */
.kyear{display:flex;flex-direction:column;gap:6px}
.ky{font-family:var(--f-text);font-weight:700;font-size:17px}
.krow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px;text-align:left}
.kbtn .ks{font-weight:700;font-size:16px}.kbtn .kd{font-size:12px;color:var(--sub)}.kbtn .kb{font-size:12.5px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.kp{margin:0}

/* 今日の学習 */
.today .big{display:flex;align-items:baseline;gap:8px}
.today .big b{font-family:var(--f-text);font-size:48px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.today .big span{font-size:16px;color:var(--sub)}
.today .days{font-variant-numeric:tabular-nums;color:var(--ink)}
.today .go{font-size:16px;padding:15px}
.tbar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;flex:1;min-width:40px}
.tbar.lg{height:10px}
.tbar span{display:block;height:100%;background:var(--ok);border-radius:99px}
.tb{display:flex;align-items:center;gap:8px;flex:1;font-size:12px;color:var(--sub);white-space:nowrap}
.hit{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:10px 12px;font-weight:700;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}

/* 理解と確認 */
.gist{background:var(--accent-soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.gist .eyebrow{color:var(--accent)}
.passage mark{background:var(--warn-soft);color:var(--ink);font-weight:700;padding:0 2px;border-radius:3px}
details.hint{font-size:13.5px;color:var(--sub)}
details.hint summary{cursor:pointer;font-weight:700;color:var(--accent)}
details.hint p{margin-top:6px}
.whyx{border-left:3px solid var(--seal);padding:4px 0 4px 12px;font-size:14px}
.blank.given{background:transparent;border-color:var(--line);color:var(--sub)}
.opt.cand{border-color:var(--accent);background:var(--accent-soft)}
.opts.cmp{grid-template-columns:1fr}

/* タブ */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tab-h)}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:var(--sub)}
nav.tabs button .ic{font-family:var(--f-text);font-size:19px;line-height:1}
nav.tabs button.on{color:var(--accent)}
nav.tabs button.on .ic{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;font-weight:700;z-index:30}
@media (prefers-reduced-motion:no-preference){.opt,.blank,.btn{transition:background-color .15s,border-color .15s}}
</style>

<div class="wrap" id="app">
  <header class="top">
    <div>
      <div class="eyebrow">社労士 一般常識 選択式対策</div>
      <h1>白書・判例ドリル</h1>
    </div>
    <div class="yr">2027年度<br>（第59回）向け</div>
  </header>
  <main id="main"></main>
</div>
<nav class="tabs" aria-label="画面切替"><div class="in" id="tabs"></div></nav>
<div class="toast" id="toast" hidden></div>

<script>
/* ===== データ =====
   本文中の {{正解|ダミー|ダミー|ダミー}} が穴になる。
   判例は判旨の要点（受験用に要約。判決原文は裁判所HPで確認）。
   統計は2026年10月22日時点で公表済みの最新値（主に2025年値）。src に出典を持つ。 */
const CASES = [
 /* ---- 労働組合法：R6・R7・R8と3年連続で選択式に出た分野。2027年も最優先 ---- */
 {id:"c12",type:"case",prio:"S",exam:"R8選択 労一C・D",title:"朝日放送事件",meta:"最三小判 平7.2.28｜労組法7条の「使用者」",
  text:"一般に使用者とは労働契約上の雇用主をいうものであるが、労働組合法7条が団結権の侵害に当たる一定の行為を不当労働行為として排除、是正して{{正常な労使関係を回復する|企業秩序の維持を確保する|労働三権を実質的に保障する|労働条件の対等決定を実現する}}ことを目的としていることにかんがみると、雇用主以外の事業主であっても、雇用主から労働者の派遣を受けて自己の業務に従事させ、その労働者の基本的な労働条件等について、雇用主と{{部分的|全面的|実質的|一時的}}とはいえ同視できる程度に{{現実的かつ具体的に支配、決定することができる|経営上の関心を持たざるを得ない|当事者として直接的に関与することを求められる|影響力を有して協議に参加する}}地位にある場合には、その限りにおいて、当該事業主は同条の「使用者」に当たる。",
  point:"令和8年の本試験で、目的部分（C）と「現実的かつ具体的に支配、決定」（D）の2か所が空欄になった。目的部分まで覚えている受験生は少なく、差がついた。"},
 {id:"c21",type:"case",prio:"S",exam:"R7選択 労一D・E",title:"オリエンタルモーター事件",meta:"最二小判 平7.9.8｜食堂の使用拒否と不当労働行為",
  text:"組合が会社の許可なく食堂を使用し続けたことは、会社の{{施設管理|人事管理|労務指揮|業務命令}}権を無視するものであり、正当な組合活動に当たらない。条件が折り合わないまま会社が食堂の使用を許諾しない状態が続いていることをもって、会社の権利の濫用であると認めるべき特段の事情があるとはいえず、{{組合の弱体化を図ろうとしたもの|組合に対する報復を目的としたもの|組合員を差別的に取り扱ったもの|組合の運営に介入したもの}}であるとも断じ得ないから、食堂使用の拒否は不当労働行為に当たらない。",
  point:"施設利用を拒んでも、権利濫用の特段の事情や組合弱体化の意図がなければ不当労働行為にならない。国鉄札幌運転区事件と同じ考え方。"},
 {id:"c22",type:"case",prio:"S",exam:"R6選択 労一C・D",title:"朝日火災海上保険（高田）事件",meta:"最三小判 平8.3.26｜労働協約の一般的拘束力",
  text:"労働組合法17条により、一の工場事業場の4分の3以上の数の労働者が一の労働協約の適用を受けるに至ったときは、他の同種労働者に対しても労働協約の{{規範|債務|拘束|直律}}的効力が及ぶ。協約上の基準が一部の点で未組織の同種労働者の労働条件より不利益とみられる場合であっても、そのことだけで不利益部分の効力が及ばないと解するのは相当でない。ただし、当該労働協約を特定の未組織労働者に適用することが{{著しく不合理である|客観的に合理的な理由を欠く|労働協約の目的を逸脱する|社会通念上相当でない}}と認められる特段の事情があるときは、その効力を当該労働者に及ぼすことはできない。",
  point:"労組法17条（一般的拘束力・4分の3以上）とセット。原則は不利益でも及ぶ、例外は「著しく不合理」。"},
 {id:"c23",type:"case",prio:"A",exam:"",title:"国鉄札幌運転区事件",meta:"最三小判 昭54.10.30｜企業施設を使った組合活動",
  text:"労働組合又はその組合員が、使用者の所有し管理する物的施設であって定立された企業秩序のもとに事業の運営の用に供されているものを、使用者の{{許諾|指示|命令|黙認}}を得ることなく組合活動のために利用することは許されない。その利用を許さないことが使用者の{{権利の濫用|不当労働行為|信義則違反|公序良俗違反}}であると認められるような特段の事情がある場合を除いては、当該物的施設を管理利用する使用者の権限を侵し、{{企業秩序|職場規律|労使関係|業務運営}}を乱すものであって、正当な組合活動として許容されるものではない。",
  point:"令和7年に出たオリエンタルモーター事件の土台となった判例。施設利用は「許諾」が原則。"},
 {id:"c24",type:"case",prio:"A",exam:"",title:"三井倉庫港運事件",meta:"最一小判 平元.12.14｜ユニオン・ショップ協定の効力",
  text:"ユニオン・ショップ協定のうち、締結組合以外の{{他の労働組合|使用者の利益代表者の組織|従業員親睦団体|産業別労働組合}}に加入している者及び締結組合から脱退し又は除名されたが、他の労働組合に加入し又は新たな労働組合を結成した者について使用者の解雇義務を定める部分は、民法{{90条|1条|415条|709条}}の規定により無効である。",
  point:"労働者の組合選択の自由と、他組合の団結権を侵害する部分は公序違反で無効。"},
 {id:"c25",type:"case",prio:"A",exam:"",title:"東芝労働組合小向支部事件",meta:"最二小判 平19.2.2｜組合脱退の自由",
  text:"労働組合から脱退する権利を行使しないことを労働者に義務付けて、脱退の効力そのものを生じさせないとする合意部分は、{{脱退の自由|団結の自由|結社の自由|職業選択の自由}}という重要な権利を奪い、組合の統制への{{永続的な服従|一時的な服従|事実上の協力|包括的な同意}}を強いるものであるから、公序良俗に反し、無効である。",
  point:"労組法系の判例が3年続いたので、組合と組合員の関係を扱う判例も押さえておく。"},

 {id:"c26",type:"case",prio:"S",exam:"R5選択 労一A・B",title:"大日本印刷事件",meta:"最二小判 昭54.7.20｜採用内定",
  text:"採用内定通知のほかには労働契約締結のための特段の意思表示をすることが予定されていなかったことを考慮すると、採用内定により、就労の始期を大学卒業直後とし、それまでの間、誓約書記載の採用内定取消事由に基づく{{解約権を留保|試用期間を設定|労働条件を保留|研修義務を付加}}した労働契約が成立したと解するのが相当である。採用内定の取消事由は、採用内定当時{{知ることができず、また知ることが期待できないような|採用内定の前から既に判明していたような|当事者双方が採用内定の時点で予見していたような|使用者が容易に調査することができたような}}事実であって、これを理由として採用内定を取り消すことが解約権留保の趣旨、目的に照らして客観的に合理的と認められ社会通念上相当として是認することができるものに限られる。",
  point:"「始期付解約権留保付労働契約」。内定取消の基準は「知ることができず、また知ることが期待できないような事実」。"},
 {id:"c27",type:"case",prio:"S",exam:"R4選択 労一D・E",title:"日立メディコ事件",meta:"最一小判 昭61.12.4｜有期契約の雇止め",
  text:"5回にわたり契約が更新されていた臨時員の雇用関係は、ある程度の{{継続が期待されていた|終身雇用が予定されていた|更新が約束されていた|正社員への転換が予定されていた}}ものであり、このような労働者を契約期間満了によって雇止めにするに当たっては、{{解雇に関する法理|就業規則の不利益変更法理|試用期間の法理|配転命令の法理}}が類推される。雇止めが無効とされる場合には、期間満了後における使用者と労働者間の法律関係は、{{従前の労働契約が更新された|期間の定めのない契約に転換された|新たな労働契約が締結された|労働契約が終了した}}のと同様の法律関係となる。",
  point:"現在の労働契約法19条（雇止め法理）の元になった判例。条文と判旨の両方から出る。"},
 {id:"c01",type:"case",prio:"A",exam:"",title:"秋北バス事件",meta:"最大判 昭43.12.25｜就業規則の不利益変更",
  text:"新たな就業規則の作成又は変更によって労働者に不利益な労働条件を一方的に課することは原則として許されないが、労働条件の{{集合的|個別的|一時的|恒常的}}処理、特にその統一的かつ画一的な決定を建前とする就業規則の性質からいって、当該規則条項が{{合理的|適法|必要|相当}}なものであるかぎり、個々の労働者において、これに{{同意|異議|署名|承認}}しないことを理由として、その適用を拒否することは許されない。",
  point:"労働契約法10条の源流。「合理的なものであるかぎり」「同意しないことを理由として適用を拒否できない」がセットで出る。"},
 {id:"c02",type:"case",prio:"B",exam:"",title:"第四銀行事件",meta:"最二小判 平9.2.28｜就業規則変更の合理性",
  text:"就業規則の変更の合理性は、変更によって労働者が被る{{不利益の程度|精神的苦痛|経済的損失|生活上の影響}}、使用者側の変更の必要性の内容・程度、変更後の就業規則の内容自体の相当性、{{代償措置|経過措置|救済措置|激変緩和措置}}その他関連する他の労働条件の改善状況、{{労働組合等との交渉の経緯|行政機関による指導の内容|同業他社における労働条件の動向|株主総会における決議の状況}}、他の労働組合又は他の従業員の対応、同種事項に関する我が国社会における一般的状況等を{{総合考慮|個別に考慮|比較衡量|厳格に審査}}して判断すべきである。",
  point:"合理性の判断要素の列挙。労契法10条の「労働組合等との交渉の状況」と並べて覚える。"},
 {id:"c03",type:"case",prio:"B",exam:"",title:"三菱樹脂事件",meta:"最大判 昭48.12.12｜採用の自由",
  text:"企業者は、経済活動の一環としてする{{契約締結の自由|営業の自由|職業選択の自由|結社の自由}}を有し、いかなる者を雇い入れるか、いかなる条件でこれを雇うかについて、法律その他による特別の制限がない限り、原則として{{自由|慎重|公正|平等}}にこれを決定することができる。企業者が特定の{{思想、信条|国籍、人種|性別、年齢|学歴、職歴}}を有する者をそのゆえをもって雇い入れることを拒んでも、それを当然に違法とすることはできない。",
  point:"採用の自由。労基法3条は「雇入れ後」の差別を禁止するもので、雇入れそのものは制限しない。"},
 {id:"c04",type:"case",prio:"A",exam:"",title:"高知放送事件",meta:"最二小判 昭52.1.31｜普通解雇と解雇権濫用",
  text:"普通解雇事由がある場合においても、使用者は常に解雇しうるものではなく、当該具体的な事情のもとにおいて、解雇に処することが{{著しく不合理|やや不合理|違法|不公平}}であり、{{社会通念上|客観的に|信義則上|法律上}}相当なものとして是認することができないときには、当該解雇の意思表示は、{{解雇権の濫用|公序良俗違反|不当労働行為|信義則違反}}として無効になる。",
  point:"労契法16条「客観的に合理的な理由を欠き、社会通念上相当であると認められない」の判例上の出発点。"},
 {id:"c05",type:"case",prio:"A",exam:"R4選択 労基B・C",title:"東亜ペイント事件",meta:"最二小判 昭61.7.14｜転勤命令",
  text:"業務上の必要性が存しない場合又は存する場合であっても、{{他の不当な動機・目的|業務外の事情|労働者の同意がない|手続上の瑕疵}}をもってなされたものであるとき若しくは労働者に対し{{通常甘受すべき程度|社会通念上許容される程度|受忍限度|合理的な範囲}}を著しく超える不利益を負わせるものであるとき等、特段の事情の存する場合でなければ、当該転勤命令は権利の濫用になるものではない。業務上の必要性は、{{余人をもっては容易に替え難い|業務の継続に不可欠である|経営上やむを得ない|緊急かつ重大である}}といった高度の必要性に限定することは相当でない。",
  point:"令和4年の労基法の選択式で出題。一般常識でも出る判例は、科目をまたいで繰り返し使われる。"},
 {id:"c06",type:"case",prio:"A",exam:"R6選択 労基B",title:"三菱重工業長崎造船所事件",meta:"最一小判 平12.3.9｜労働時間の概念",
  text:"労働基準法上の労働時間とは、労働者が使用者の{{指揮命令下|管理監督下|業務命令下|支配下}}に置かれている時間をいい、これに該当するか否かは、労働者の行為が使用者の指揮命令下に置かれたものと評価することができるか否かにより{{客観的|主観的|形式的|画一的}}に定まるものであって、労働契約、就業規則、{{労働協約|労使慣行|労使協定|労働者の同意}}等の定めのいかんにより決定されるべきものではない。",
  point:"令和6年の労基法の選択式で出題。「客観的に定まる」も狙われやすい。"},
 {id:"c07",type:"case",prio:"B",exam:"R5選択 労基C",title:"大星ビル管理事件",meta:"最一小判 平14.2.28｜仮眠時間",
  text:"不活動仮眠時間であっても、{{労働からの解放|休憩の自由利用|場所的な拘束の解除|自由な外出}}が保障されていない場合には労働基準法上の労働時間に当たる。仮眠室における待機と警報や電話等に対して直ちに相当の対応をすることを義務付けられていたときは、実作業への従事が{{皆無に等しい|相当程度ある|恒常的である|予定されている}}など実質的に義務付けがされていないと認めることができるような事情がない限り、労働時間に当たる。",
  point:"「労働からの解放」は令和5年の労基法の選択式で、大林ファシリティーズ事件の空欄として出た語でもある。"},
 {id:"c28",type:"case",prio:"A",exam:"R6選択 労基C",title:"シンガー・ソーイング・メシーン事件",meta:"最二小判 昭48.1.19｜退職金債権の放棄",
  text:"退職金債権を放棄する旨の意思表示は、賃金全額払の原則の趣旨に照らし、それが労働者の{{自由な意思|真意|合理的な判断|明示的な承諾}}に基づくものであると認めるに足りる合理的な理由が{{客観的|主観的|形式的|相当程度}}に存在するときは、有効である。",
  point:"「自由な意思」は山梨県民信用組合事件、広島中央保健生協事件にも出てくる決まり文句。"},
 {id:"c08",type:"case",prio:"A",exam:"",title:"電通事件",meta:"最二小判 平12.3.24｜過労自殺と安全配慮",
  text:"使用者は、その雇用する労働者に従事させる業務を定めてこれを管理するに際し、業務の遂行に伴う{{疲労や心理的負荷|危険や有害物質|長時間の拘束|過重な責任}}等が過度に蓄積して労働者の{{心身の健康|生命及び身体|職業生活|家庭生活}}を損なうことがないよう注意する義務を負う。",
  point:"精神障害の労災認定が過去最多という統計とセットで、白書の文脈でも使われやすい。"},
 {id:"c09",type:"case",prio:"B",exam:"",title:"神戸弘陵学園事件",meta:"最三小判 平2.6.5｜契約期間か試用期間か",
  text:"雇用契約に期間を設けた趣旨・目的が労働者の{{適性|能力|勤務態度|健康状態}}を評価・判断するためのものであるときは、期間の満了により雇用契約が当然に終了する旨の{{明確な合意|口頭の約束|就業規則の定め|労使慣行}}が成立しているなどの特段の事情が認められる場合を除き、その期間は契約の存続期間ではなく、{{試用期間|研修期間|見習期間|有期契約期間}}であると解するのが相当である。",
  point:"有期契約の形でも、目的が適性判断なら「試用期間」。採用内定（大日本印刷事件）と並べて覚える。"},
 {id:"c10",type:"case",prio:"A",exam:"",title:"山梨県民信用組合事件",meta:"最二小判 平28.2.19｜不利益変更への同意",
  text:"賃金や退職金に関する労働条件の変更に対する労働者の同意の有無については、変更を受け入れる旨の行為の有無だけでなく、不利益の内容及び程度、行為に至った経緯及び態様、行為に先立つ労働者への{{情報提供又は説明|労働条件通知書の交付|労働者代表からの意見聴取|代償措置の提示}}の内容等に照らして、当該行為が労働者の{{自由な意思|真意|合理的な判断|明示的な承諾}}に基づいてされたものと認めるに足りる合理的な理由が{{客観的|主観的|形式的|相当程度}}に存在するか否かという観点からも判断されるべきである。",
  point:"「自由な意思」「合理的な理由が客観的に存在」の決まり文句。"},
 {id:"c11",type:"case",prio:"B",exam:"",title:"フジ興産事件",meta:"最二小判 平15.10.10｜懲戒の根拠",
  text:"使用者が労働者を懲戒するには、あらかじめ就業規則において{{懲戒の種別及び事由|懲戒の手続及び時期|懲戒権者及び範囲|懲戒の基準及び程度}}を定めておくことを要する。そして、就業規則が法的規範としての拘束力を生ずるためには、その内容を適用を受ける事業場の労働者に{{周知|届出|説明|交付}}させる手続が採られていることを要する。",
  point:"「種別及び事由」と「周知」の2語が穴埋めで狙われやすい。"},
 {id:"c13",type:"case",prio:"B",exam:"",title:"日立製作所武蔵工場事件",meta:"最一小判 平3.11.28｜時間外労働義務",
  text:"使用者が{{36協定|就業規則|労働協約|労働契約}}を締結し、所轄労働基準監督署長に届け出た場合において、就業規則に当該協定の範囲内で時間外労働をさせることができる旨を定めているときは、当該就業規則の規定の内容が{{合理的|適法|明確|相当}}なものである限り、それが具体的労働契約の内容をなすから、労働者はその定めるところに従い、時間外労働をする義務を負う。",
  point:"36協定だけでは義務は生じない（免罰効果）。就業規則の合理的な定めがあって初めて契約上の義務になる。"},
 {id:"c14",type:"case",prio:"B",exam:"",title:"横浜南労基署長（旭紙業）事件",meta:"最一小判 平8.11.28｜労働者性",
  text:"自己所有のトラックを持ち込んで運送業務に従事していた運転手について、会社は業務の性質上当然に必要とされる指示をしていた以外には、業務の遂行に関し特段の{{指揮監督|安全配慮|人事評価|業務指示}}を行っていたとはいえず、時間的、場所的な{{拘束の程度|管理の程度|自由度|裁量の範囲}}も一般の従業員と比較してはるかに緩やかであったことから、労働基準法上の{{労働者|事業者|使用者|請負人}}に該当せず、労災保険法上の労働者にも該当しない。",
  point:"労働者性は「指揮監督下の労働」と「報酬の労務対償性」で判断する。"},
 {id:"c15",type:"case",prio:"A",exam:"",title:"長澤運輸事件",meta:"最二小判 平30.6.1｜定年後再雇用と待遇差",
  text:"有期契約労働者が定年退職後に再雇用された者であることは、労働条件の相違が不合理と認められるか否かの判断において、旧労働契約法20条にいう「{{その他の事情|職務の内容|配置の変更の範囲|業務の必要性}}」として考慮される。また、不合理か否かの判断は、賃金の総額を比較することのみによるのではなく、{{賃金項目の趣旨|賃金総額の水準|業界の相場|労使交渉の結果}}を個別に考慮すべきである。",
  point:"現在のパート・有期法8条（不合理な待遇の禁止）へ引き継がれた考え方。"},
 {id:"c16",type:"case",prio:"A",exam:"",title:"名古屋自動車学校事件",meta:"最一小判 令5.7.20｜再雇用後の基本給",
  text:"正職員と定年後再雇用の嘱託職員との基本給の相違が不合理と認められるか否かを判断するに当たっては、基本給の{{性質及び支給の目的|金額及び支給の方法|算定基準及び時期|総額及び比率}}を踏まえ、労使交渉に関する事情についても、その{{具体的な経緯|最終的な結果|形式的な手続|労働者の人数}}をも勘案すべきである。",
  point:"新しい最高裁判例はまだ選択式で使われていないものが多く、今後の出題候補。"},
 {id:"c17",type:"case",prio:"A",exam:"",title:"滋賀県社会福祉協議会事件",meta:"最二小判 令6.4.26｜職種限定合意と配置転換",
  text:"労働者と使用者との間に当該労働者の{{職種や業務内容|勤務地や勤務時間|賃金や退職金|職位や役職}}を特定のものに限定する旨の合意がある場合には、使用者は、当該労働者に対し、その{{個別的同意|包括的同意|労働組合の同意|過半数代表者の同意}}なしに当該合意に反する{{配置転換|出向|降格|懲戒処分}}を命ずる権限を有しない。",
  point:"東亜ペイント事件（職種限定なし→配転命令は原則有効）との対比で覚える。"},
 {id:"c18",type:"case",prio:"B",exam:"",title:"協同組合グローブ事件",meta:"最三小判 令6.4.16｜事業場外みなし",
  text:"「労働時間を算定し難いとき」に当たるか否かは、業務の性質、内容やその遂行の態様、状況等、使用者と労働者との間で業務に関する{{指示及び報告|連絡及び相談|命令及び承認|記録及び管理}}がされているときは、その方法、内容やその実施の態様、状況等を{{総合|個別に|厳格に|形式的に}}して判断すべきである。原審は、業務日報による報告の{{正確性|提出頻度|記載量|承認手続}}について十分に検討していない。",
  point:"労基法38条の2。令和8年の労基法の選択式では、条文の「労働時間を算定し難い」が空欄になった。"},
 {id:"c19",type:"case",prio:"B",exam:"",title:"広島中央保健生協事件",meta:"最一小判 平26.10.23｜妊娠中の軽易業務転換と降格",
  text:"妊娠中の軽易業務への転換を契機として降格させる措置は、原則として男女雇用機会均等法{{9条3項|6条|5条|11条}}の禁止する取扱いに当たる。ただし、労働者が{{自由な意思|真意|合理的な判断|明示的な承諾}}に基づいて降格を承諾したものと認めるに足りる合理的な理由が客観的に存在するとき等は、この限りでない。",

 {id:"c20",type:"case",prio:"B",exam:"",title:"国・人事院（経産省職員）事件",meta:"最三小判 令5.7.11｜性自認とトイレ使用制限",

 {id:"l02",type:"law",prio:"S",exam:"R7選択 労一C",title:"労働施策総合推進法 30条の2",meta:"パワーハラスメント防止措置",
  text:"事業主は、職場において行われる優越的な関係を背景とした言動であって、{{業務上必要かつ相当な範囲を超えたもの|客観的に合理的な理由を欠くもの|社会通念上相当でないもの|通常甘受すべき程度を著しく超えるもの}}によりその雇用する労働者の{{就業環境|健康状態|職業生活|労働条件}}が害されることのないよう、当該労働者からの相談に応じ、適切に対応するために必要な体制の整備その他の雇用管理上必要な措置を講じなければならない。",

 {id:"l11",type:"law",prio:"S",exam:"R8選択 社一D・E",title:"確定拠出年金法 1条",meta:"目的",
  text:"この法律は、少子高齢化の進展、{{高齢期の生活の多様化|高齢期の価値観の多様化|就業形態の変化|産業構造の変化}}等の社会経済情勢の変化にかんがみ、個人又は事業主が拠出した資金を個人が自己の責任において運用の指図を行い、高齢期においてその結果に基づいた給付を受けることができるようにするため、確定拠出年金について必要な事項を定め、国民の高齢期における所得の確保に係る{{自主的な努力|自助的な活動|事前的な準備|積極的な取組み}}を支援し、もって公的年金の給付と相まって国民の生活の安定と福祉の向上に寄与することを目的とする。",
  point:"確定給付企業年金法1条との違いは「高齢期の生活の多様化」（確拠）と「産業構造の変化」（確給）。"},
 {id:"l12",type:"law",prio:"S",exam:"",title:"確定給付企業年金法 1条",meta:"目的（2027年の最有力候補）",
  text:"この法律は、少子高齢化の進展、{{産業構造の変化|高齢期の生活の多様化|就業形態の変化|雇用の流動化}}等の社会経済情勢の変化にかんがみ、事業主が従業員と{{給付の内容|掛金の額|運用の方法|拠出の時期}}を約し、高齢期において従業員がその内容に基づいた給付を受けることができるようにするため、確定給付企業年金について必要な事項を定め、国民の高齢期における所得の確保に係る{{自主的な努力|自助的な活動|事前的な準備|積極的な取組み}}を支援し、もって公的年金の給付と相まって国民の生活の安定と福祉の向上に寄与することを目的とする。",
  point:"企業年金（確給・確拠）は令和3〜8年の6年間で5回出ている。確拠の目的条文が出た翌年なので、確給の目的条文の可能性が高い。"},
 {id:"l13",type:"law",prio:"A",exam:"R6選択 社一C",title:"国民健康保険法 1条",meta:"目的",
  text:"この法律は、国民健康保険事業の{{健全な運営|安定的な財政|適正な実施|円滑な実施}}を確保し、もって{{社会保障及び国民保健の向上|社会保険及び国民福祉の向上|社会保障及び国民福祉の向上|社会保険及び国民保健の向上}}に寄与することを目的とする。",
  point:"令和6年は「社会保障／社会保険」と「保健／福祉」の組合せ4択で出た。"},
 {id:"l14",type:"law",prio:"A",exam:"R6選択 社一D・E",title:"高齢者医療確保法 1条",meta:"目的",
  text:"この法律は、国民の高齢期における適切な医療の確保を図るため、医療費の適正化を推進するための計画の作成及び保険者による健康診査等の実施に関する措置を講ずるとともに、高齢者の医療について、国民の{{共同連帯|自助と共助|自助と連帯|共助連帯}}の理念等に基づき、前期高齢者に係る保険者間の{{費用負担|給付費用|負担割合|給付割合}}の調整、後期高齢者に対する適切な医療の給付等を行うために必要な制度を設け、もって国民保健の向上及び高齢者の福祉の増進を図ることを目的とする。",
  point:"高確法は令和5〜7年に3年連続で出た（20条・1条・4条）。"},
 {id:"l15",type:"law",prio:"S",exam:"",title:"介護保険法 1条",meta:"目的",
  text:"この法律は、加齢に伴って生ずる心身の変化に起因する疾病等により要介護状態となった者等について、これらの者が{{尊厳|名誉|人権|自律}}を保持し、その有する能力に応じ{{自立した日常生活|健康で文化的な生活|安定した家庭生活|充実した社会生活}}を営むことができるよう、必要な保健医療サービス及び福祉サービスに係る給付を行うため、国民の{{共同連帯|自助と共助|相互扶助|社会連帯}}の理念に基づき介護保険制度を設け、もって国民の保健医療の向上及び福祉の増進を図ることを目的とする。",
  point:"令和7年は介護保険法2条（医療との連携）が出た。令和8年版厚生労働白書のテーマも医療・介護の現場なので、介護保険の条文は出やすい。"},
 {id:"l16",type:"law",prio:"A",exam:"R7選択 社一C",title:"介護保険法 2条2項",meta:"保険給付の基本",
  text:"保険給付は、要介護状態等の軽減又は悪化の防止に資するよう行われるとともに、{{医療との連携|事業者又は施設との連携|被保険者の心身の状況|家族の介護負担}}に十分配慮して行われなければならない。",

  text:"{{地方公共団体|国|保険者|後期高齢者医療広域連合}}は、この法律の趣旨を尊重し、住民の高齢期における医療に要する費用の適正化を図るための取組及び高齢者医療制度の運営が適切かつ円滑に行われるよう所要の施策を実施しなければならない。",

 {id:"l18",type:"law",prio:"A",exam:"",title:"児童手当法 1条",meta:"目的（児童手当法は令和3〜5年に3年連続で出題）",
  text:"この法律は、子ども・子育て支援の適切な実施を図るため、父母その他の保護者が子育てについての{{第一義的責任|最終的責任|共同責任|主たる責任}}を有するという基本的認識の下に、児童を養育している者に児童手当を支給することにより、家庭等における{{生活の安定|経済的負担の軽減|福祉の増進|子育ての支援}}に寄与するとともに、次代の社会を担う児童の{{健やかな成長|健全な育成|心身の発達|自立}}に資することを目的とする。",

 {id:"l19",type:"law",prio:"B",exam:"",title:"社会保険労務士法 1条",meta:"社会保険労務士の使命（2025年改正で「目的」から改められた）",

/* ===== 保存 ===== */
const S={get(k,d){try{const v=localStorage.getItem("srh_"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("srh_"+k,JSON.stringify(v))}catch(e){}}};
let progress=S.get("progress",{});
let verified=S.get("verified",{});
const INTERVALS=[0,1,3,7,16,35];

const EXAM=new Date(2027,7,22);
const TYPE_LABEL={case:"判例",law:"条文",stat:"白書・統計"};

const byPrio=(a,b)=>(PR[a.prio]??3)-(PR[b.prio]??3);

/* ===== 道具 ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const today=()=>ymd(new Date());
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
const MARK="①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳";
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,1800)}

function allCards(){return [...CASES,...STATS]}
function byId(id){return allCards().find(c=>c.id===id)}
function parse(text){
  const parts=[];let last=0;const re=/\{\{([^}]+)\}\}/g;let m;
  while((m=re.exec(text))){if(m.index>last)parts.push({t:"s",v:text.slice(last,m.index)});
    const xs=m[1].split("|").map(s=>s.trim()).filter(Boolean);parts.push({t:"b",ans:xs[0],decoys:xs.slice(1)});last=re.lastIndex}
  if(last<text.length)parts.push({t:"s",v:text.slice(last)});return parts}
function answersOf(type){const out=[];allCards().filter(c=>!type||c.type===type).forEach(c=>parse(c.text).forEach(p=>{if(p.t==="b")out.push(p.ans)}));return out}
/* ===== 出題と記録 ===== */
const NUMRE=/^([\d,]+(?:\.\d+)?)(％|倍|人|円|日|年|件|時間)?$/;
const CATS=[["数字","数字・割合"],["方向","増減・方向"],["用語","制度・用語"],["言い回し","判例・条文の言い回し"]];
function cat(w){
  if(/^(上昇|低下|横ばい|増加|減少|過去最|上回|下回|同率|同数|縮小|拡大|悪化)/.test(w))return "方向";
  if(/\d/.test(w)&&w.length<=14)return "数字";
  if(w.length>=9||/(する|される|もの|ない|できる|である|こと|的に|かつ|ような|させ)/.test(w))return "言い回し";
  return "用語"}
/* 本試験と同じく等間隔の数字を、毎回位置を変えて作り直す */
function numSeries(ans,decoys){
  const m=ans.match(NUMRE);if(!m)return null;
  const ds=decoys.map(d=>d.match(NUMRE)).filter(x=>x&&x[2]===m[2]);if(ds.length<2)return null;
  const v=+m[1].replace(/,/g,""),dec=(m[1].split(".")[1]||"").length;
  const steps=ds.map(x=>Math.abs(+x[1].replace(/,/g,"")-v)).filter(x=>x>0);if(!steps.length)return null;
  const step=Math.min(...steps),k=Math.floor(Math.random()*4);
  const vals=[0,1,2,3].map(i=>v+(i-k)*step);if(vals.some(x=>x<=0))return null;
  const fmt=x=>{let s=x.toFixed(dec);if(m[1].includes(",")){const [a,b]=s.split(".");s=Number(a).toLocaleString("en-US")+(b?"."+b:"")}return s+(m[2]||"")};
  return vals.map(fmt)}
function optionsFor(b,card){
  if(b.decoys.length===1)return shuffle([b.ans,b.decoys[0]]); /* 上昇／低下のような方向は2択のまま出す */
  const ns=Math.random()<0.6?numSeries(b.ans,b.decoys):null;if(ns&&ns.includes(b.ans))return ns;
  const set=[b.ans,...shuffle(b.decoys.filter(d=>d!==b.ans)).slice(0,3)];
  /* 半分の確率で1つを同じ種類の別の語に入れ替え、選択肢の見た目で覚えないようにする */
  const c=cat(b.ans),pool=shuffle(answersOf().filter(a=>a!==b.ans&&!set.includes(a)&&c!=="数字"&&cat(a)===c));
  if(pool.length&&set.length>=4&&Math.random()<0.5)set[1+Math.floor(Math.random()*3)]=pool.pop();
  while(set.length<4&&pool.length)set.push(pool.pop());
  return shuffle([...new Set(set)])}
function blanksOf(c){return parse(c.text).filter(p=>p.t==="b")}
function cardState(p){if(!p.b||!p.b.length)return;p.box=Math.min(...p.b.map(x=>x.box));p.due=p.b.map(x=>x.due||"9999").sort()[0]}
/* 以前のカード単位の記録を、空欄単位に移す */
function prog(id){const p=progress[id];if(!p)return {box:0,due:null,b:[]};
  if(!p.b){const c=byId(id);p.b=c?blanksOf(c).map(()=>({box:p.box||0,due:p.due||null})):[];cardState(p)}
  return p}
/* 空欄ごとに記録する。間違えた空欄は翌日。期日前の正解では間隔を延ばさない（前倒しで覚えたことにしない） */
function record(id,res){
  const c=byId(id),t=today();const p=progress[id]?prog(id):{b:blanksOf(c).map(()=>({box:0,due:null}))};
  Object.entries(res).forEach(([i,ok])=>{const b=p.b[i]||(p.b[i]={box:0,due:null});
    if(!ok){b.box=1;b.due=addDays(1);b.wrong=true}
    else{b.wrong=false;if(!b.due||b.due<=t){b.box=Math.min(b.box+1,5);b.due=addDays(INTERVALS[b.box])}}});
  cardState(p);p.last=t;if(!p.first)p.first=t;progress[id]=p;S.set("progress",progress);return bump(1)}
/* 1日の解答数と連続日数。目標に届いた瞬間だけ true を返す */
let log=S.get("log",{});let goal=S.get("goal",10);
function todayCount(){return log[today()]||0}
function bump(n){const t=today(),before=log[t]||0;log[t]=before+n;S.set("log",log);return before<goal&&log[t]>=goal}
function streak(){const d=new Date();let c=0;if(!log[ymd(d)])d.setDate(d.getDate()-1);while(log[ymd(d)]){c++;d.setDate(d.getDate()-1)}return c}
function todayBar(){const n=todayCount(),p=Math.min(100,Math.round(n/goal*100));return `<div class="tb"><div class="tbar"><span style="width:${p}%"></span></div><span>今日 <b>${n}</b>/${goal}問</span></div>`}
function weakCards(){return allCards().filter(c=>progress[c.id]&&prog(c.id).b.some(x=>x.wrong))}
function dueCards(){const t=today();return allCards().filter(c=>progress[c.id]&&prog(c.id).due<=t)}
function startToday(){const need=Math.max(goal-todayCount(),5);startDrill(nextBatch([],need))}
/* 選んだ答えが「なぜ違うか」 */
function why(w,b,card){
  if(NOTE[w])return NOTE[w];
  const other=allCards().find(c=>c.id!==card.id&&blanksOf(c).some(x=>x.ans===w));
  if(other)return `「${w}」は「${other.title}」で出てくる語。`;
  if(cat(w)==="数字"&&cat(b.ans)==="数字")return `正しくは${b.ans}。数字は「何割台か」「何％台か」というおおよその水準で覚える。`;
  if(cat(b.ans)==="方向"||cat(w)==="方向")return `正しくは「${b.ans}」。${WHY[card.id]||""}`;
  if(card.type==="case")return `判旨の言葉は「${b.ans}」。「${w}」は判決文にない言い回しで、似た言葉で迷わせる選択肢。`;
  if(card.type==="law")return `条文の言葉は「${b.ans}」。「${w}」は条文にない言葉。条文は一字一句ではなく、キーワードの組合せで覚える。`;
  return `白書・統計の言葉は「${b.ans}」。${WHY[card.id]||""}`}

function chips(c){let h="";
  if(c.prio)h+=`<span class="chip ${c.prio==="S"?"seal":c.prio==="B"?"ok":""}">優先${c.prio}</span> `;
  if(c.exam)h+=`<span class="chip warn">${esc(c.exam)}</span> `;
  if(c.type==="law")h+='<span class="chip">条文</span> ';
  return h}
function dots(box){let h='<span class="dots" aria-label="習熟度'+box+'/5">';for(let i=1;i<=5;i++)h+=`<i class="${i<=box?"on":""}"></i>`;return h+"</span>"}

/* --- カード演習 ---
   流れは「理解（初めてのカードは先に読む）→ 想起（穴埋め）→ 確認（なぜ違うかを読む）」。
   間違えた空欄は数問後にもう一度出し、その場で正しい答えを思い出させる。 */
const GIST_LABEL={case:"事案と結論",law:"趣旨",stat:"背景"};
function itemOf(x){return typeof x==="string"?{id:x}:x}
function nextBatch(recent,size=5){
  const t=today(),all=allCards().filter(c=>!recent.includes(c.id));
  const due=all.filter(c=>progress[c.id]&&prog(c.id).due<=t);
  const newToday=allCards().filter(c=>progress[c.id]&&progress[c.id].first===t).length;
  const fresh=all.filter(c=>!progress[c.id]).sort(byPrio).slice(0,Math.max(0,goal-newToday));
  return [...new Set([...due,...fresh].map(c=>c.id))].slice(0,size)}
function startDrill(ids){session={kind:"drill",ids,idx:0,ans:{},active:0,read:{}};render();window.scrollTo(0,0)}
function gistOf(card){return GIST[card.id]||WHY[card.id]||""}
function viewRead(card,parts){
  const s=session;const filled=parts.map(p=>p.t==="s"?esc(p.v):`<mark>${esc(p.ans)}</mark>`).join("");
  $("#main").innerHTML=`<div class="stack">
    <div class="row" style="justify-content:space-between"><span class="eyebrow">はじめてのカード</span>${todayBar()}<button class="btn ghost" id="quit">やめる</button></div>
    <div class="panel stack">
      <div><h2>${esc(card.title)}</h2><div class="row muted">${esc(card.meta||"")} ${chips(card)}</div></div>
      ${gistOf(card)?`<div class="gist"><span class="eyebrow">${GIST_LABEL[card.type]}</span><p>${esc(gistOf(card))}</p></div>`:""}
      <p class="muted">まず読んで、<mark>色の付いた語</mark>を覚えてください。次の画面で、この語を思い出して解きます。</p>
      <div class="passage">${filled}</div>
      ${card.point?`<p class="point">${esc(card.point)}</p>`:""}
    </div>
    <button class="btn primary block" id="toq">覚えたので、問題として解く</button>
  </div>`;
  $("#quit").onclick=()=>{session=null;render()};
  $("#toq").onclick=()=>{s.read[card.id]=true;viewDrill();window.scrollTo(0,0)};
}
function viewDrillEnd(){
  const n=todayCount();
  $("#main").innerHTML=`<div class="stack">
    <section class="panel stack"><div class="eyebrow">今日の分はここまで</div>
      <h2>期日が来た復習と、今日の新しいカード（${goal}枚まで）を解きました</h2>

      <button class="btn primary block" id="e-sho">初見問題トレーニング（知らない問題で3点を取る）</button>
      <div class="krow"><button class="btn" id="e-cmp">比較ドリル</button><button class="btn" id="e-kako">過去問を解く</button></div>

function viewDrill(){
  const s=session;
  if(s.idx>=s.ids.length)return viewDrillEnd();
  const it=itemOf(s.ids[s.idx]);const card=byId(it.id);if(!card){s.idx++;return viewDrill()}
  const parts=parse(card.text);const blanks=parts.filter(p=>p.t==="b");
  if(!it.only&&!progress[card.id]&&!s.read[card.id])return viewRead(card,parts);
  if(!s.opts)s.opts=blanks.map(b=>optionsFor(b,card));
  if(it.only&&!s.pre){blanks.forEach((b,i)=>{if(!it.only.includes(i))s.ans[i]=b.ans});s.pre=true;s.active=it.only[0]}
  const done=Object.keys(s.ans).length===blanks.length;
  let bi=-1;
  const html=parts.map(p=>{if(p.t==="s")return esc(p.v);bi++;const a=s.ans[bi];
    if(a===undefined)return `<button class="blank ${s.active===bi?"active":""}" data-b="${bi}">（${MARK[bi]}）</button>`;
    if(it.only&&!it.only.includes(bi))return `<span class="blank given">${esc(a)}</span>`;
    return a===p.ans?`<span class="blank right">${esc(a)}</span>`:`<span class="blank wrong">${esc(a)}<span class="fix">正：${esc(p.ans)}</span></span>`}).join("");
  const wrongs=done?blanks.map((b,i)=>({b,i,a:s.ans[i]})).filter(x=>x.a!==x.b.ans):[];
  $("#main").innerHTML=`<div class="stack">
    <div class="row" style="justify-content:space-between"><span class="eyebrow">${it.only?"さっき間違えた空欄":TYPE_LABEL[card.type]}</span>${todayBar()}<button class="btn ghost" id="quit">やめる</button></div>
    <div class="panel stack">
      <div><h2>${esc(card.title)}</h2><div class="row muted">${esc(card.meta||"")} ${chips(card)}</div></div>
      ${!done&&gistOf(card)?`<details class="hint"><summary>ヒント：${GIST_LABEL[card.type]}</summary><p>${esc(gistOf(card))}</p></details>`:""}
      <div class="passage">${html}</div>
    </div>
    ${done?`<div class="panel stack">
        <div class="row">${wrongs.length?'<span class="stamp">要復習</span>':'<span class="stamp ok">正解</span>'}<span class="muted">${it.only?"もう一度確認しました":wrongs.length?"間違えた空欄は数問後にもう一度出ます":"次回："+INTERVALS[prog(card.id).box]+"日後"}</span></div>
        ${s.hit?`<p class="hit">今日の目標 ${goal}問 達成。このまま続けても、ここでやめてもOK。</p>`:""}
        ${wrongs.map(x=>`<div class="whyx"><b>「${esc(x.a)}」を選んだ：</b>${esc(why(x.a,x.b,card))}</div>`).join("")}
        ${wrongs.length&&gistOf(card)?`<div class="gist"><span class="eyebrow">${GIST_LABEL[card.type]}</span><p>${esc(gistOf(card))}</p></div>`:""}
        ${card.point?`<p class="point">${esc(card.point)}</p>`:""}
        ${card.src?`<a class="muted" href="${esc(card.src)}" target="_blank" rel="noopener">出典を開く</a>`:""}
      </div>
      <button class="btn primary block" id="next">次の問題へ</button>`
    :dock(`<div class="dock-h"><span>空欄（${MARK[s.active]}）に入る語</span></div><div class="opts">${s.opts[s.active].map(o=>`<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>`)}
  </div>`;
  $("#quit").onclick=()=>{session=null;render()};
  document.querySelectorAll(".blank[data-b]").forEach(b=>b.onclick=()=>{s.active=+b.dataset.b;viewDrill()});
  document.querySelectorAll(".opt[data-o]").forEach(b=>b.onclick=()=>{
    s.ans[s.active]=b.dataset.o;
    const next=blanks.findIndex((_,i)=>s.ans[i]===undefined);
    if(next>=0){s.active=next;return viewDrill()}
    if(it.only){s.hit=bump(1)}
    else{const res={};blanks.forEach((bb,i)=>res[i]=s.ans[i]===bb.ans);s.hit=record(card.id,res);
      const wrong=blanks.map((bb,i)=>s.ans[i]===bb.ans?-1:i).filter(i=>i>=0);
      if(wrong.length)s.ids.splice(Math.min(s.idx+4,s.ids.length),0,{id:card.id,only:wrong})}
    viewDrill()});
  if(done)$("#next").onclick=()=>{s.idx++;
    if(s.idx>=s.ids.length)s.ids=s.ids.concat(nextBatch(s.ids.slice(-5).map(x=>itemOf(x).id),5));
    s.ans={};s.active=0;s.opts=null;s.pre=false;s.hit=false;viewDrill();window.scrollTo(0,0)};
  fitDock();
}

/* --- 初見問題トレーニング ---
   まだ解いていない文章で、①語の種類を当てる ②その種類の語だけに絞る ③選ぶ、の順に練習する。
   知らない問題でも、語群の仕分けと前後の言葉で2択まで絞れるようにするのが目的。 */
function clueOf(sg,segs){
  const i=segs.indexOf(sg),after=(segs[i+1]&&segs[i+1].t==="s"?segs[i+1].v:"").slice(0,6),before=(segs[i-1]&&segs[i-1].t==="s"?segs[i-1].v:"").slice(-6);
  const c=cat(sg.ans);
  if(/^(％|%|倍|人|円|日|年|件|時間|ポイント|万|千|条)/.test(after))return `直後が「${after[0]}」なので、数字が入る。`;
  if(/第$/.test(before))return "直前が「第」なので、数字が入る。";
  if(c==="方向")return "数値の動きを述べる文なので、増減・方向を表す語が入る。";
  if(c==="言い回し")return `直後が「${after.slice(0,4)}」と続くので、ひとまとまりの言い回し（判例・条文の述語や修飾の部分）が入る。`;
  if(c==="数字")return "数量を述べる部分なので、数字が入る。";
  return `前後が「${before.slice(-3)}〜${after.slice(0,3)}」なので、制度名や用語のような名詞が入る。`}
function startShoken(){
  const unseen=shuffle(allCards().filter(c=>!progress[c.id]));
  const old=allCards().filter(c=>progress[c.id]).sort((a,b)=>(prog(a.id).last||"").localeCompare(prog(b.id).last||""));
  const pool=[...unseen,...old];const passages=[];let n=0;
  for(const c of pool){if(n>=5)break;const parts=parse(c.text);const bs=parts.filter(p=>p.t==="b");if(!bs.length)continue;
    const keep=shuffle(bs.map((_,i)=>i)).slice(0,Math.min(5-n,2));
    let bi=-1;const segs=parts.map(p=>{if(p.t==="s")return p;bi++;if(keep.includes(bi))return {t:"b",ans:p.ans,decoys:p.decoys,orig:bi,card:c};return {t:"s",v:p.ans}});
    passages.push({card:c,segs});n+=keep.length}
  let k=0;passages.forEach(ps=>ps.segs.forEach(sg=>{if(sg.t==="b")sg.k=k++}));
  const blanks=passages.flatMap(ps=>ps.segs.filter(sg=>sg.t==="b").map(sg=>(sg.segs=ps.segs,sg)));
  const words=new Set(blanks.map(b=>b.ans));
  shuffle(blanks.flatMap(b=>b.decoys)).forEach(d=>{if(words.size<14)words.add(d)});
  for(const [c] of CATS){const extra=shuffle(answersOf().filter(a=>cat(a)===c&&!words.has(a)));while(extra.length&&[...words].filter(w=>cat(w)===c).length<3&&words.size<20)words.add(extra.pop())}

function viewShoken(){

      <h3>考え方の振り返り</h3>

      <p class="muted">解いたカードは復習の予定に入りました。</p></div>
      <div class="krow"><button class="btn" id="home">ホームへ</button><button class="btn primary" id="again">次の初見問題へ</button></div>`

  $("#quit").onclick=()=>{session=null;render()};

/* --- 選択式（本試験形式） ---
   R8の労一は空欄ごとの4択、社一は20語の語群。どちらの形式でも練習できるようにする。 */
let exam=null;let examScope=S.get("scope","mix");let examFmt=S.get("fmt","four");
function buildExam(){
  let pool=allCards();
  if(examScope==="case")pool=pool.filter(c=>c.type==="case"||c.type==="law");
  if(examScope==="stat")pool=pool.filter(c=>c.type==="stat");
  if(examScope==="s")pool=pool.filter(c=>c.prio==="S");
  pool=shuffle(pool);const passages=[];let n=0;
  for(const c of pool){if(n>=5)break;const parts=parse(c.text);const bs=parts.filter(p=>p.t==="b");if(!bs.length)continue;
    const keep=shuffle(bs.map((_,i)=>i)).slice(0,Math.min(5-n,bs.length===1?1:Math.max(2,Math.ceil(bs.length/2))));
    let bi=-1;const segs=parts.map(p=>{if(p.t==="s")return p;bi++;if(keep.includes(bi))return {t:"b",ans:p.ans,decoys:p.decoys,k:null,card:c,orig:bi};return {t:"s",v:p.ans}});
    passages.push({card:c,segs});n+=keep.length}
  if(!n)return null;
  let k=0;passages.forEach(ps=>ps.segs.forEach(sg=>{if(sg.t==="b")sg.k=k++}));
  const blanks=passages.flatMap(ps=>ps.segs.filter(sg=>sg.t==="b"));
  blanks.forEach(b=>b.opts=optionsFor(b,b.card));
  const words=new Set(blanks.map(b=>b.ans));
  shuffle(blanks.flatMap(b=>b.decoys)).forEach(d=>{if(words.size<16)words.add(d)});
  shuffle(answersOf()).forEach(a=>{if(words.size<20)words.add(a)});
  return {passages,blanks,words:shuffle([...words]),fill:{},active:0,graded:false}}
function viewExam(){
  const L="ABCDE";
  const seg=(name,items,cur)=>`<div class="seg" role="group" aria-label="${name}">${items.map(([k,l])=>`<button class="${cur===k?"on":""}" data-${name==="出題範囲"?"s":"f"}="${k}">${l}</button>`).join("")}</div>`;
  if(!exam){
    $("#main").innerHTML=`<div class="stack"><h2>選択式（本試験形式）</h2>
      <p class="muted">5つの空欄（A〜E）を埋めます。令和8年の本試験は、労一が空欄ごとの4択、社一が20語の語群から選ぶ形式でした。3点以上が基準点の目安です。</p>
      <div class="eyebrow">形式</div>${seg("形式",[["four","空欄ごと4択（労一型）"],["gogun","語群20（社一型）"]],examFmt)}
      <div class="eyebrow">出題範囲</div>${seg("出題範囲",[["s","優先S"],["mix","混合"],["case","判例・条文"],["stat","白書・統計"]],examScope)}
      <button class="btn primary block" id="start">問題を作る</button></div>`;
    document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{examScope=b.dataset.s;S.set("scope",examScope);viewExam()});
    document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{examFmt=b.dataset.f;S.set("fmt",examFmt);viewExam()});
    $("#start").onclick=()=>{exam=buildExam();if(!exam){toast("この範囲のカードがありません");return}viewExam()};return}
  const e=exam;const used=new Set(Object.values(e.fill));
  const score=e.blanks.filter(b=>e.fill[b.k]===b.ans).length;
  const passHtml=e.passages.map(ps=>`<div class="passage"><span class="lbl">${esc(ps.card.title)}｜${esc(ps.card.meta||"")}</span>${ps.segs.map(sg=>{
    if(sg.t==="s")return esc(sg.v);const v=e.fill[sg.k];
    if(e.graded){return v===sg.ans?`<span class="blank right">${L[sg.k]}：${esc(v)}</span>`:`<span class="blank wrong">${L[sg.k]}：${esc(v||"未解答")}<span class="fix">正：${esc(sg.ans)}</span></span>`}
    return `<button class="blank ${e.active===sg.k?"active":""}" data-k="${sg.k}">${L[sg.k]}${v?"："+esc(v):""}</button>`}).join("")}</div>`).join("");
  const choices=examFmt==="four"
    ?`<div class="opts">${e.blanks[e.active].opts.map((w,i)=>`<button class="opt ${e.fill[e.active]===w?"right":""}" data-w="${esc(w)}"><b>${MARK[i]}</b> ${esc(w)}</button>`).join("")}</div>`
    :`<div class="gogun">${e.words.map((w,i)=>`<button class="opt ${used.has(w)?"used":""}" data-w="${esc(w)}"><b>${MARK[i]||i+1}</b>${esc(w)}</button>`).join("")}</div>`;
  $("#main").innerHTML=`<div class="stack">
    <div class="row" style="justify-content:space-between"><h2>選択式</h2><button class="btn ghost" id="reset">作り直す</button></div>
    <div class="panel stack">${passHtml}</div>
    ${e.graded?`<div class="panel stack"><div class="result"><span class="score">${score}/5</span>${score>=3?'<span class="stamp ok">基準点クリア</span>':'<span class="stamp">基準点に届かず</span>'}</div>
       ${e.blanks.filter(b=>e.fill[b.k]!==b.ans).map(b=>`<div class="whyx"><b>${L[b.k]}：正しくは「${esc(b.ans)}」</b>${e.fill[b.k]?`<br>「${esc(e.fill[b.k])}」を選んだ：${esc(why(e.fill[b.k],b,b.card))}`:""}</div>`).join("")}
       <p class="muted">間違えた空欄は、翌日の復習に入りました。</p></div>
       <button class="btn primary block" id="new">次の問題</button>`
     :dock(`<div class="dock-h"><span>空欄 <b>${L[e.active]}</b> に入る語</span><button class="btn primary" id="grade">採点する</button></div>${choices}`)}
  </div>`;
  $("#reset").onclick=()=>{exam=null;viewExam()};
  document.querySelectorAll(".blank[data-k]").forEach(b=>b.onclick=()=>{e.active=+b.dataset.k;viewExam()});
  document.querySelectorAll(".opt[data-w]").forEach(b=>b.onclick=()=>{const w=b.dataset.w;
    if(e.fill[e.active]===w)delete e.fill[e.active];else e.fill[e.active]=w;
    const next=e.blanks.find(bb=>e.fill[bb.k]===undefined);if(next&&e.fill[e.active]!==undefined)e.active=next.k;viewExam()});
  if(e.graded)$("#new").onclick=()=>{exam=buildExam();viewExam();window.scrollTo(0,0)};
  else $("#grade").onclick=()=>{e.graded=true;e.passages.forEach(ps=>{const res={};ps.segs.filter(sg=>sg.t==="b").forEach(sg=>res[sg.orig]=e.fill[sg.k]===sg.ans);record(ps.card.id,res)});viewExam();window.scrollTo(0,0)};
  fitDock();
}

    const r=$("#rel");if(r)r.onclick=()=>startDrill(k.rel);
    $("#nextk").onclick=()=>{const i=KSETS.indexOf(k);session={kind:"kako",set:KSETS[(i+1)%KSETS.length],fill:{},active:"A",graded:false};viewKakoSolve();window.scrollTo(0,0)};
    $("#again").onclick=()=>{s.fill={};s.graded=false;s.active=keys[0];viewKakoSolve();window.scrollTo(0,0)};
  }else $("#grade").onclick=()=>{s.graded=true;bump(keys.length);if(kbest[k.id]===undefined||score>kbest[k.id]){kbest[k.id]=score;S.set("kbest",kbest)}viewKakoSolve();window.scrollTo(0,0)};
  fitDock();
}

/* 選択肢を画面下に固定する。問題文が隠れないよう、下の余白と選択中の空欄の位置を合わせる */
function dock(html){return `<div class="dock" id="dock"><div class="dock-in">${html}</div></div>`}
function fitDock(){
  const d=$("#dock");$("#main").style.paddingBottom=d?(d.offsetHeight+12)+"px":"";
  if(!d)return;
  const a=document.querySelector(".blank.active");if(!a)return;
  const r=a.getBoundingClientRect(),limit=d.getBoundingClientRect().top-12;
  if(r.bottom>limit||r.top<60)window.scrollBy({top:r.top-Math.max(80,(limit-r.height)/2),behavior:"smooth"});
}

/* ===== 起動 ===== */
$("#tabs").addEventListener("click",ev=>{const b=ev.target.closest("[data-tab]");if(b){exam=b.dataset.tab==="exam"?exam:exam;go(b.dataset.tab)}});
const h=(location.hash||"").slice(1);if(TABS.some(t=>t[0]===h))tab=h;
render();
</script>
